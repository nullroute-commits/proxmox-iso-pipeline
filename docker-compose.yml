services:
  # Main ISO builder service
  builder:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Remote cache is optional - only used when ghcr.io is accessible
      # The pipeline works without GitHub by building locally
      cache_from:
        - type=local,src=/tmp/.buildx-cache
    image: proxmox-iso-builder:latest
    container_name: proxmox-iso-builder
    init: true  # Proper PID 1 handling and zombie process reaping
    # Use specific capabilities instead of full privileged mode
    cap_add:
      - SYS_ADMIN  # Required for mount/umount ISO operations
      - MKNOD      # Required for loop device creation
    devices:
      - /dev/loop-control:/dev/loop-control  # Loop device for ISO mounting
    security_opt:
      - apparmor:unconfined  # Required for mount operations
    volumes:
      - ./output:/workspace/output
      - ./work:/workspace/work
      - ./firmware-cache:/workspace/firmware-cache
      - ./config:/workspace/config:ro
      - ./src:/workspace/src:ro
    environment:
      - PROXMOX_VERSION=${PROXMOX_VERSION:-9.1}
      - DEBIAN_RELEASE=${DEBIAN_RELEASE:-trixie}
      - INCLUDE_NVIDIA=${INCLUDE_NVIDIA:-true}
      - INCLUDE_AMD=${INCLUDE_AMD:-true}
      - INCLUDE_INTEL=${INCLUDE_INTEL:-true}
    networks:
      - iso-builder-network

  # Firmware downloader service
  firmware-downloader:
    image: proxmox-iso-builder:latest
    container_name: firmware-downloader
    init: true
    volumes:
      - ./firmware-cache:/workspace/firmware-cache
      - ./config:/workspace/config:ro
    environment:
      - DEBIAN_RELEASE=${DEBIAN_RELEASE:-trixie}
    command: python -c "from src.firmware import FirmwareManager; import pathlib; fm = FirmwareManager(pathlib.Path('/workspace/firmware-cache'), 'trixie'); fm.download_firmware('freeware'); print('Firmware download complete')"
    depends_on:
      - builder
    networks:
      - iso-builder-network

  # Linting service for code quality checks
  linter:
    image: proxmox-iso-builder:latest
    container_name: iso-builder-linter
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    volumes:
      - ./src:/workspace/src:ro
      - ./.flake8:/workspace/.flake8:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
    command: lint
    networks:
      - iso-builder-network

networks:
  iso-builder-network:
    driver: bridge
